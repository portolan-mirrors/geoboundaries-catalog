# Human-enriched metadata for the adm0 collection.
#
# This file is tracked in git and is never published: tools/publish.py skips
# every dot-directory. It is the canonical home for the facts below, and
# README.md carries the human-facing rendering of them. Keep the two in step.

license: CC-BY-4.0
